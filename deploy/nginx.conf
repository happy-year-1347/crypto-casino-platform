# /etc/nginx/sites-available/casino
# Replace YOUR_DOMAIN and the PHP socket version if you use a different PHP.
#
# First deploy (before SSL): keep only the port 80 server block and remove the
# "return 301" line so certbot can validate the domain. certbot rewrites this
# file when you run: certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/casino/public;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/casino/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/casino.access.log;
    error_log  /var/log/nginx/casino.error.log;

    # nginx only gzips HTML by default, so the 1.4 MB JS bundle went out raw.
    # (put these in /etc/nginx/conf.d/compression.conf without "gzip on", it is
    #  already set in nginx.conf)
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/ttf font/otf;

    # vite puts a hash in these file names, so they never change under the same name
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the 12 local slot games are static bundles, cache them hard
    location ^~ /originals/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|mp3|ogg|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    # never serve dotfiles, and no PHP execution from upload folders
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/storage/.*\.php$ { deny all; }
}
